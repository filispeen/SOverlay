<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <link rel="stylesheet" href="jquery-ui.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Mulish&display=swap');
        .cube {
            background-color: rgb(255, 0, 0);
            position: fixed;
            left: 97.44%;
            top: 0%;
            width: 2.55%;
            height: 4.53%;
            z-index: 1;
            justify-content: center;
            justify-items: center;
        }
        .EDIT_MODE {
          font-size: 79px;
          font-family: "Mulish", sans-serif;
          color: rgb(0, 255, 240);
          line-height: 1.2;
          text-align: center;
          position: absolute;
          left: 39.94%;
          top: 45.65%;
        }
        body {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .resizable {
            position: absolute;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .resize-handle {
            width: 10px;
            height: 10px;
            background-color: black;
            position: absolute;
            right: 0;
            bottom: 0;
            cursor: se-resize;
        }
    </style>
    <body>
        <div class="cube" id="close">
            <p style="text-align: center; margin: 0; top: 25%; position: relative;">&#10006</p> <!--z-index: 2; position: absolute; left: 35%; top: -5px;-->
        </div>
        <p class="EDIT_MODE">EDIT_MODE</p>

        <div class="resizable" id="chat" style="width: 100px; height: 100px; background-color: rgba(0, 0, 0, 0.200); top: 50px; left: 50px;">
            <div class="resize-handle"></div>
        </div>
        <!--<div class="resizable" style="width: 100px; height: 100px; background-color: green; top: 200px; left: 200px;">
            <div class="resize-handle"></div>
        </div>
        <div class="resizable" style="width: 100px; height: 100px; background-color: blue; top: 350px; left: 350px;">
            <div class="resize-handle"></div>
        </div>-->
    
        <script src="jquery-3.6.0.min.js"></script>
        <script src="jquery-ui.min.js"></script>
        <script defer>
            const close_btn = document.getElementById("close");
    
            close_btn.addEventListener("click", () => {api.close();});
    
            close_btn.addEventListener('mouseenter', () => {
                console.log("Forward false");
                close_btn.style.backgroundColor = "rgb("+160+","+0+","+0+")";
                api.forward_false();
            });
    
            close_btn.addEventListener('mouseleave', () => {
                console.log("Forward true");
                close_btn.style.backgroundColor = "rgb("+255+","+0+","+0+")";
                api.forward_true();
            });

            //Listeners
            $(function() {
            $(".resizable").each(function() {
                var $this = $(this);
        
                $this.on('mouseenter', function() {
                    console.log("Forward false");
                    api.forward_false();
                });
                $this.on('mouseleave', function() {
                    console.log("Forward true");
                    api.forward_true();
                });

                // Make the div draggable
                $this.draggable({
                    drag: function(event, ui) {
                        logPositionAndSize(ui, $this);
                    }
                });
        
                // Make the div resizable
                $this.resizable({
                    handles: 'se',
                    resize: function(event, ui) {
                        logPositionAndSize(ui, $this);
                    }
                });
            });
        
            function logPositionAndSize(ui, $element) {
                console.log('Position:', ui.position);
                
                // Размер можно получить непосредственно у элемента
                var size = ui.size || {
                    width: $element.width(),
                    height: $element.height()
                };
                
                console.log('Size:', size);
                var width = size.width;
                var height = size.height;
                var x = ui.position.left
                var y = ui.position.top
                api.push_chat_props({width, height, x, y})
            }
        });
        </script>
        <script>
            const requestWindowSize = async () => {
                const windowSize = await window.api.get_window_props();
                console.log(windowSize);
                document.getElementById('chat').style.width = windowSize.width + "px";
                document.getElementById('chat').style.height = windowSize.height + "px";
                document.getElementById('chat').style.top = windowSize.y + "px";
                document.getElementById('chat').style.left = windowSize.x + "px";
            }
            requestWindowSize();
        </script>
    </body>
</html>
