<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Overlay</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: transparent; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            box-sizing: border-box;
        }
        #debug-panel {
            position: fixed;
            top: 12px;
            right: 12px;
            background-color: rgba(0, 0, 0, 0.6);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.4;
            white-space: pre;
            max-width: 360px;
            z-index: 1000;
        }
        #preview-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .preview-item {
            position: absolute;
            overflow: hidden;
        }
        .preview-content {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            display: block;
            border: 0;
        }
    </style>
</head>
<body>
    <div id="debug-panel" style="display: block;"></div>
    <div id="preview-panel"></div>
    <script src="index.js"></script>
</body>
</html>
